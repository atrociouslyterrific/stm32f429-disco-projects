name: Train writer

# Trains the Writer's language model on GitHub's computers: gathers the books listed in
# Writer/books.txt (and any .txt files in Writer/books/), trains, checks the C code that runs
# the model on the board gives the same answers, and keeps the result for the build. Each run
# carries on from the last. While it runs, it publishes its progress every 30 seconds (to the
# "status-writer" branch), which the website shows. When it finishes, the build runs again so
# the board and the website get the new model.
#
# It runs once each time it is started (Actions > Train writer > Run workflow), or when the
# books change. It does not keep restarting itself.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How many minutes to train for (up to 300)"
        default: "60"
  push:
    branches: [main]
    paths:  # what it learns from, or how it learns, changed
      - "Writer/books.txt"
      - "Writer/books/**.txt"
      - "tools/writer_corpus.py"
      - "tools/train_writer.py"

permissions:
  contents: write

concurrency:
  group: train-writer
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyTorch (on GitHub's computer)
        run: pip install --quiet torch==2.5.1 numpy==2.1.3

      - name: Fetch the model trained so far (to carry on from)
        run: |
          mkdir -p work/previous
          gh release download writer-model -p writer_model.pt -p writer_training.json -D work/previous --clobber \
            && echo "Carrying on from the last training run" \
            || echo "No earlier model: starting from scratch"

      - name: Gather the books
        run: python3 tools/writer_corpus.py work/corpus.txt

      - name: Train, reporting progress as it goes
        run: |
          MINUTES="${{ github.event.inputs.minutes || '60' }}"
          case "$MINUTES" in ''|*[!0-9]*) MINUTES=60 ;; esac
          [ "$MINUTES" -gt 300 ] && MINUTES=300
          [ "$MINUTES" -lt 2 ] && MINUTES=2

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add --detach status-tree HEAD
          (cd status-tree && git checkout -q --orphan status-writer-report && git rm -rfq . )
          FIRST=1
          publish() {
            [ -f "$1" ] || return 0
            cp "$1" status-tree/writer.json
            (
              cd status-tree
              git add writer.json
              if [ "$FIRST" = 1 ]; then git commit -qm "Writer training progress"; else git commit -q --amend -m "Writer training progress"; fi
              git push -qf origin HEAD:status-writer
            ) && FIRST=0 || echo "(couldn't publish progress this time)"
          }

          TRAIN_MINUTES="$MINUTES" python3 -u tools/train_writer.py work/corpus.txt work \
            work/previous/writer_model.pt work/previous/writer_training.json &
          TRAINER=$!
          while kill -0 "$TRAINER" 2>/dev/null; do
            sleep 30
            publish work/writer_progress.json
          done
          wait "$TRAINER"
          publish work/writer_training.json

      - name: Check the C code gives the same answers as the trained model
        run: |
          mkdir -p work/gen && cp work/lm_model.h work/gen/
          gcc -O2 -Wall -DLM_TOOLS -DLM_KV_FLOAT -IWriter -Iwork/gen tools/lm_test.c Writer/lm.c -lm -o work/lm_exact
          gcc -O2 -Wall -DLM_TOOLS -IWriter -Iwork/gen tools/lm_test.c Writer/lm.c -lm -o work/lm_board
          work/lm_exact work/lm_reference.txt
          work/lm_board work/lm_reference.txt

      - name: Keep the model for the build
        run: |
          gh release view writer-model >/dev/null 2>&1 || \
            gh release create writer-model --title "Writer language model" \
              --notes "The Writer's language model, trained on GitHub: lm_model.h (for the board and the website), the full model (to carry on training from), and the training summary. Replaced by every training run."
          gh release upload writer-model work/lm_model.h work/writer_training.json work/writer_model.pt work/lm_reference.txt --clobber
