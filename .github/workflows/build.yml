name: Build programs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:  # rebuild with the new brains (or talk or writer model) whenever a training run finishes
    workflows: ["Train fish brains", "Train fish talk", "Train writer"]
    types: [completed]

permissions:
  contents: write  # lets the build publish the "latest" download

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm  # same runner pool as the Pip and Bloop builds
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install the ARM compiler
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi make gcc libc6-dev clang lld

      - name: Check the font pictures (prints a sample)
        run: |
          gcc -Wall -Icommon tools/check_font.c common/font.c -o check_font
          ./check_font

      - name: Get the trained fish brains
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The "Train fish brains" workflow keeps its results in a release. Use them if they
          # fit the current rules; otherwise the next step trains some quickly instead.
          mkdir -p build/gen
          if gh release download fish-brains -p fish_brains.h -p fish_training.json -D build/gen --clobber; then
            if gcc -fsyntax-only -IFish -Ibuild/gen tools/check_brains.c; then
              echo "Using the brains from the last training run"
            else
              echo "Those brains don't fit the current rules: training fresh ones in this build"
              rm -f build/gen/fish_brains.h build/gen/fish_training.json
            fi
          else
            echo "No trained brains yet: training some in this build"
          fi

      - name: Get the trained talk model
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The "Train fish talk" workflow keeps its model in a release. Without one (or with
          # one in an older layout), the build uses a stand-in and the animals stay quiet.
          mkdir -p build/gen
          if gh release download fish-talk -p talk_model.h -p talk_training.json -D build/gen --clobber \
             && grep -q "define TALK_FORMAT 1$" build/gen/talk_model.h; then
            echo "Using the trained talk model"
            # Check the talk code (as changed in this build) still gives the trained model's answers.
            if gh release download fish-talk -p talk_reference.txt -D build --clobber; then
              gcc -O2 -Wall -DTALK_TOOLS -DTALK_KV_FLOAT -IFish -Ibuild/gen tools/talk_test.c Fish/fish_talk.c Fish/fish_sim.c -lm -o build/talk_exact
              gcc -O2 -Wall -DTALK_TOOLS -IFish -Ibuild/gen tools/talk_test.c Fish/fish_talk.c Fish/fish_sim.c -lm -o build/talk_board
              build/talk_exact build/talk_reference.txt
              build/talk_board build/talk_reference.txt
            else
              echo "(no reference answers saved with this model yet: skipping the talk check)"
            fi
          else
            echo "No usable talk model yet: the animals will stay quiet"
            rm -f build/gen/talk_model.h build/gen/talk_training.json
          fi

      - name: Get the Writer's trained language model
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p build/gen
          if gh release download writer-model -p lm_model.h -p writer_training.json -p lm_reference.txt -D build/gen --clobber \
             && grep -q "define LM_FORMAT 1$" build/gen/lm_model.h; then
            echo "Using the trained Writer model"
            gcc -O2 -Wall -DLM_TOOLS -DLM_KV_FLOAT -IWriter -Ibuild/gen tools/lm_test.c Writer/lm.c -lm -o build/lm_exact
            gcc -O2 -Wall -DLM_TOOLS -IWriter -Ibuild/gen tools/lm_test.c Writer/lm.c -lm -o build/lm_board
            build/lm_exact build/gen/lm_reference.txt
            build/lm_board build/gen/lm_reference.txt
          else
            echo "No Writer model yet: the Writer will say it hasn't learned to write"
            rm -f build/gen/lm_model.h build/gen/writer_training.json
          fi

      - name: Compile every program
        run: make

      - name: Build the fish rules for web browsers (for the website's live tank)
        run: make web && ls -l build/fish.wasm

      - name: Check each program starts the way the chip expects
        run: |
          # First 4 bytes = where the stack begins (must be in RAM, 0x2003xxxx);
          # next 4 = first code to run (must be in flash, 0x08xxxxxx).
          for f in build/*.bin; do
            echo "$f: $(stat -c %s "$f") bytes"
            od -A n -t x4 -N 8 "$f" | tee head.txt
            grep -Eq '^ *2003[0-9a-f]{4} 08[0-9a-f]{6}' head.txt
          done

      - uses: actions/upload-artifact@v4
        with:
          name: programs
          path: build/*.bin

      - name: Update "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTES="Build ${{ github.run_number }} · $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Put it on the board from Chrome: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          if gh release view latest >/dev/null 2>&1; then  # (runs after a training run too, on main)
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest --title "Latest program files" --notes "$NOTES"
          fi
          gh release upload latest build/*.bin --clobber

      - name: Put the flashing website together
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp build/*.bin build/fish.wasm build/writer.wasm _site/

          # Facts about this build, for the status part of the page.
          COMMIT_MESSAGE="$(git log -1 --pretty=%s)" python3 - <<'PY'
          import glob, json, os, time
          status = {
              "build": int(os.environ["GITHUB_RUN_NUMBER"]),
              "time": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "commit": os.environ["GITHUB_SHA"][:7],
              "commit_message": os.environ.get("COMMIT_MESSAGE", ""),
              "programs": [
                  {"name": os.path.basename(f)[:-4], "bytes": os.path.getsize(f)}
                  for f in sorted(glob.glob("build/*.bin"))
              ],
          }
          try:
              status["fish"] = json.load(open("build/gen/fish_training.json"))
          except OSError:
              pass
          try:
              status["talk"] = json.load(open("build/gen/talk_training.json"))
          except OSError:
              pass
          try:
              status["writer"] = json.load(open("build/gen/writer_training.json"))
          except OSError:
              pass
          # Where the Fish program keeps its "window" for the website (see fish_mirror in Fish/main.c).
          import subprocess
          symbols = subprocess.run(["arm-none-eabi-nm", "-S", "build/Fish.elf"], capture_output=True, text=True).stdout
          for line in symbols.splitlines():
              parts = line.split()
              if len(parts) == 4 and parts[3] == "fish_mirror":
                  status["fish_mirror"] = {"address": int(parts[0], 16), "size": int(parts[1], 16)}
          json.dump(status, open("_site/status.json", "w"), indent=1)
          print(json.dumps(status, indent=1))
          PY
          # Browsers keep GitHub Pages files for 10 minutes. Give the flashing code a new folder
          # name every build so a new page is never mixed up with cached older code.
          N="${{ github.run_number }}"
          mv _site/webstlink "_site/webstlink-$N"
          cp _site/fish.wasm "_site/fish-$N.wasm" # named per build, like the flashing code
          cp _site/writer.wasm "_site/writer-$N.wasm"
          sed -i "s|\./webstlink/|./webstlink-$N/|g; s|__BUILD__|$N|g" _site/index.html
          sed -i "s|__REPO__|${{ github.repository }}|g" _site/index.html
          grep -n "webstlink-$N" _site/index.html
          ls -la _site

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the finished website (scripts, files, and a five-minute test tank)
        run: node tools/check_site.mjs _site

      - name: Open the finished website in a real browser (no window) and check it works
        run: |
          mkdir -p /tmp/page-check && cp tools/check_page.mjs /tmp/page-check/
          cd /tmp/page-check
          npm init -y >/dev/null
          npm install --no-audit --no-fund --silent playwright@1.48.2
          npx playwright install --with-deps chromium >/dev/null
          (cd "$GITHUB_WORKSPACE/_site" && python3 -m http.server 8123 >/dev/null 2>&1 &)
          sleep 2
          node check_page.mjs http://localhost:8123/ "$GITHUB_WORKSPACE/page.png"

      - name: Keep the screenshot of the page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-screenshot
          path: page*.png
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    # Publish the flashing website (GitHub Pages).
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
