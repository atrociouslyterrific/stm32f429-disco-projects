name: Build programs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # lets the build publish the "latest" download

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm  # same runner pool as the Pip and Bloop builds
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install the ARM compiler
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi make

      - name: Compile Blink
        run: make -C Blink

      - name: Check the program starts the way the chip expects
        run: |
          # First 4 bytes = where the stack begins (must be in RAM, 0x2000xxxx/0x2002xxxx);
          # next 4 = first code to run (must be in flash, 0x08xxxxxx).
          od -A n -t x4 -N 8 Blink/Blink.bin | tee head.txt
          grep -Eq '^ *2003[0-9a-f]{4} 08[0-9a-f]{6}' head.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Blink
          path: Blink/Blink.bin

      - name: Update "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTES="Build ${{ github.run_number }} · $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Put it on the board from Chrome: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest --title "Latest program files" --notes "$NOTES"
          fi
          gh release upload latest Blink/Blink.bin --clobber

      - name: Put the flashing website together
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp Blink/Blink.bin _site/Blink.bin
          sed -i "s|__BUILD__|${{ github.run_number }}|g" _site/index.html
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    # Publish the flashing website (GitHub Pages).
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
